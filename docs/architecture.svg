<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 745" width="1000" height="745" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="745" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Mini-RAG — Application Architecture</text>

  <!-- CLIENT -->
  <rect x="360" y="46" width="280" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Client</text>
  <text x="500" y="84" text-anchor="middle" font-size="12" fill="#475569">Postman · curl · Swagger UI (/docs)</text>
  <line x1="500" y1="92" x2="500" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- API LAYER -->
  <rect x="40" y="120" width="920" height="112" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="56" y="142" font-size="14" font-weight="700" fill="#1d4ed8">1 · API layer — FastAPI (main.py + routes/)</text>
  <rect x="60" y="156" width="270" height="62" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="195" y="177" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">base_router</text>
  <text x="195" y="196" text-anchor="middle" font-size="11.5" fill="#475569">GET /api/v1  (health check)</text>
  <rect x="365" y="156" width="270" height="62" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="500" y="177" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">data_router</text>
  <text x="500" y="196" text-anchor="middle" font-size="11.5" fill="#475569">POST /data/upload · /data/process</text>
  <rect x="670" y="156" width="270" height="62" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="805" y="177" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">nlp_router</text>
  <text x="805" y="196" text-anchor="middle" font-size="11.5" fill="#475569">/nlp/index/push · info · search · answer</text>

  <line x1="500" y1="232" x2="500" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- CONTROLLERS -->
  <rect x="40" y="258" width="920" height="112" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="56" y="280" font-size="14" font-weight="700" fill="#15803d">2 · Controllers — business logic (controllers/)</text>
  <rect x="60" y="294" width="205" height="62" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="162" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">DataController</text>
  <text x="162" y="334" text-anchor="middle" font-size="11.5" fill="#475569">validate type &amp; size</text>
  <rect x="285" y="294" width="205" height="62" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="387" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">ProjectController</text>
  <text x="387" y="334" text-anchor="middle" font-size="11.5" fill="#475569">project folders on disk</text>
  <rect x="510" y="294" width="205" height="62" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="612" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">ProcessController</text>
  <text x="612" y="334" text-anchor="middle" font-size="11.5" fill="#475569">load (TXT/PDF) &amp; split</text>
  <rect x="735" y="294" width="205" height="62" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="837" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">NLPController</text>
  <text x="837" y="334" text-anchor="middle" font-size="11.5" fill="#475569">embed · index · search · answer</text>

  <line x1="180" y1="370" x2="180" y2="416" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="370" x2="700" y2="416" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- MODELS -->
  <rect x="40" y="418" width="290" height="140" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="56" y="440" font-size="14" font-weight="700" fill="#c2410c">3 · Models (models/)</text>
  <text x="56" y="457" font-size="11.5" fill="#475569">Data access via Motor (async MongoDB)</text>
  <rect x="58" y="468" width="254" height="24" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="185" y="485" text-anchor="middle" font-size="12" fill="#0f172a">ProjectModel · db_schemes/project</text>
  <rect x="58" y="498" width="254" height="24" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="185" y="515" text-anchor="middle" font-size="12" fill="#0f172a">AssetModel · db_schemes/asset</text>
  <rect x="58" y="528" width="254" height="24" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="185" y="545" text-anchor="middle" font-size="12" fill="#0f172a">ChunkModel · db_schemes/data_chunk</text>

  <!-- STORES -->
  <rect x="350" y="418" width="610" height="140" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="366" y="440" font-size="14" font-weight="700" fill="#7e22ce">4 · Stores — pluggable providers (Interface + Factory)</text>
  <text x="366" y="457" font-size="11.5" fill="#475569">Change a provider with one line in .env — no controller code changes</text>

  <rect x="366" y="468" width="184" height="80" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="458" y="487" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">llm/</text>
  <text x="458" y="504" text-anchor="middle" font-size="11" fill="#475569">LLMInterface</text>
  <text x="458" y="519" text-anchor="middle" font-size="11" fill="#475569">OpenAIProvider (→ Ollama)</text>
  <text x="458" y="534" text-anchor="middle" font-size="11" fill="#475569">CoHereProvider</text>

  <rect x="562" y="468" width="184" height="80" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="654" y="487" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">vectordb/</text>
  <text x="654" y="504" text-anchor="middle" font-size="11" fill="#475569">VectorDBInterface</text>
  <text x="654" y="519" text-anchor="middle" font-size="11" fill="#475569">QdrantDBProvider</text>
  <text x="654" y="534" text-anchor="middle" font-size="11" fill="#475569">cosine similarity</text>

  <rect x="758" y="468" width="184" height="80" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="850" y="487" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">templates/</text>
  <text x="850" y="504" text-anchor="middle" font-size="11" fill="#475569">TemplateParser</text>
  <text x="850" y="519" text-anchor="middle" font-size="11" fill="#475569">locales/en · locales/ar</text>
  <text x="850" y="534" text-anchor="middle" font-size="11" fill="#475569">RAG prompt templates</text>

  <!-- arrows to infra -->
  <line x1="115" y1="558" x2="115" y2="614" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="458" y1="558" x2="458" y2="614" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="654" y1="558" x2="654" y2="614" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- INFRA -->
  <text x="772" y="648" font-size="14" font-weight="700" fill="#0f172a">5 · Infrastructure</text>
  <text x="772" y="668" font-size="12" fill="#475569">100% local &amp; free — no API key</text>
  <rect x="40" y="618" width="150" height="82" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="115" y="642" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">MongoDB</text>
  <text x="115" y="661" text-anchor="middle" font-size="11" fill="#475569">Docker · port 27007</text>
  <text x="115" y="677" text-anchor="middle" font-size="11" fill="#475569">projects · assets · chunks</text>

  <rect x="205" y="618" width="145" height="82" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="277" y="642" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Local files</text>
  <text x="277" y="661" text-anchor="middle" font-size="11" fill="#475569">src/assets/files/</text>
  <text x="277" y="677" text-anchor="middle" font-size="11" fill="#475569">uploaded TXT / PDF</text>

  <rect x="366" y="618" width="184" height="82" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="458" y="642" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Ollama</text>
  <text x="458" y="661" text-anchor="middle" font-size="11" fill="#475569">localhost:11434/v1</text>
  <text x="458" y="677" text-anchor="middle" font-size="11" fill="#475569">chat model + embed model</text>

  <rect x="562" y="618" width="184" height="82" rx="10" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="654" y="642" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Qdrant</text>
  <text x="654" y="661" text-anchor="middle" font-size="11" fill="#475569">embedded, on disk</text>
  <text x="654" y="677" text-anchor="middle" font-size="11" fill="#475569">assets/database/qdrant_db</text>

  <!-- files arrow (from DataController) -->
  <path d="M 100 370 L 100 392 L 24 392 L 24 714 L 277 714 L 277 703" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <text x="500" y="736" text-anchor="middle" font-size="11.5" fill="#64748b">Dependency direction: Client → API → Controllers → (Models | Stores) → Infrastructure   ·   dashed = uploaded files saved to disk</text>
</svg>
